name: DB Migrations

on:
  push:
    branches: [main, staging]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/migrate.yml"

jobs:
  migrate:
    name: Push migrations
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # `supabase db push` no longer accepts `--project-ref` (the flag was
      # removed from the CLI). The supported flow is to `link` the project
      # first, then `push`. `link` and `push` both read SUPABASE_DB_PASSWORD
      # from the environment, so no interactive password prompt is needed.
      - name: Push → staging
        if: github.ref == 'refs/heads/staging'
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}

      - name: Push → production
        if: github.ref == 'refs/heads/main'
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROD_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
